---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-heading">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>
      {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}
    </p>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
