title: "Ken's Blog"
tagline: "Notes on AI, Business, and Life"
description: "Ken Zhou — ex-banker, corporate venturing, five years in chain retail operations, now writing about AI commercialization."
url: "https://blog.akenlabs.com"
baseurl: ""
lang: "en"
timezone: "Asia/Shanghai"

author:
  name: "Ken Zhou"

